name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [hypermedia, inertia_react, inertia_vue]
    defaults:
      run:
        working-directory: examples/with_account_kit/${{ matrix.app }}
    env:
      NODE_ENV: test
      PORT: 3333
      HOST: localhost
      LOG_LEVEL: info
      APP_KEY: '12345678901234567890123456789012'
      APP_URL: http://localhost:3333
      SESSION_DRIVER: database
      LIMITER_STORE: memory
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@v6
        with:
          version: 11.23.0
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec node ace codegen
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - name: Install browser for app journey
        run: |
          PLAYWRIGHT_CLI=$(node -p "require('node:path').join(require('node:path').dirname(require.resolve('playwright/package.json', {paths:[require.resolve('@japa/browser-client')]})), 'cli.js')")
          node "$PLAYWRIGHT_CLI" install --with-deps chromium
      - run: pnpm exec node ace test --suites browser --files tests/browser/secure_note_journey.spec.ts
      - if: matrix.app == 'hypermedia'
        run: pnpm exec node ace test --suites browser --files tests/browser/account_journey.spec.ts
      - if: matrix.app != 'hypermedia'
        run: pnpm exec node ace test --suites browser --files tests/browser/account_journeys.spec.ts
